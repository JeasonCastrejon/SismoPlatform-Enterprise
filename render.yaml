# Blueprint opcional para desplegar API + PostgreSQL en Render.
# Después de desplegar el frontend en Vercel, agrega su URL a CORS_ORIGINS en el servicio API.
databases:
  - name: sismo-platform-db
    databaseName: sismo_platform
    user: sismo_platform_user
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: sismo-platform-api
    runtime: python
    plan: starter
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sismo-platform-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOAD_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        sync: false
